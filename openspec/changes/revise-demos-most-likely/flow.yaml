track: feature
triage: "feature — escalated from tweak (set) at explore with Rue's consent: 6 demo scripts rewritten, Most Likely rebuilt as team game, explanation capability removed; > 5 S-items. One PR. Appetite: one flow run."
base: main
gate0: 2026-10-07
gate1: 2026-10-07  # approved as planned; 5th demo player for ML (partial match) not taken — tip-only
learnings:
  - "Explore on a game port where Rue states rules → compare with the archive first and show the deviation (team size, team count, scoring) as a choice. Rue's stated rule wins over the archive. (weil: Rue's ML description differed from the archive on 3 points; Rue chose own rules on each)"
  - "Track set to tweak but the request names several games → escalate at explore with a count (games × items), and ask. (weil: 3 bullets turned out to be 12 S-items across 6 games)"
  - "Long demo tap-throughs in e2e → set test.setTimeout per demo test from the step count (~0.8s/step on phone) instead of relying on the 30s default. (weil: U2's 27-step Imposter demo timed out on phone)"
  - "proof:full in a builder → run it in the background (Bash run_in_background), it takes ~9 min. (weil: Bash's 2-min timeout backgrounded it mid-run for U2)"
  - "Per-game demo tests outside demo.test.ts (e.g. imposter engine.test.ts 'imposter demo' block) → list them in the demo unit's files. (weil: U2 had to edit engine.test.ts outside its file list)"
  - "Engine contract change in a unit with Screen/Setup tasks → planner orders tasks so each commit typechecks (engine + minimal Screen/Setup adapt in one task), or states that intermediate commits run vitest only. (weil: U1's 1.1/1.2 commits fail svelte-check on their own)"
  - "Old demo assertions living in engine.test.ts (imposter, wavelength) → move them to demo.test.ts or list them in the demo unit's files; duplicated 'Scenario:' names across files confuse coverage. (weil: U2 and U5 both had to edit engine.test.ts; U5 left duplicate scenario names)"
  - "Scoped e2e runs in a builder (npx playwright test <file>) → run `npm run build` first; playwright serves the existing build/. (weil: U8 got misleading failures from a stale build)"
