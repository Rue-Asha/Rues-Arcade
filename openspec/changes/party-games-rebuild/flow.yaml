triage: "feature — new repo, data model, deploy pipeline, new features, redesign; appetite ~3 sessions (foundation + Imposter + Wavelength)"
base: main
gate0: 2026-10-05
gate1: 2026-10-05
notes:
  - "Repo was created fresh with git init; main has no commit yet (unborn). Planner: settle how main gets its root commit before Build/Ship (new GitHub repo Rue-Asha/Rues-Arcade is created only at Ship, with consent)."
  - "User wants a pause at every checkpoint so they can /clear."
  - "U1 (wave 1): Kit 3 has no svelte.config.js; Kit config lives in vite.config.ts. Rng interface is exported from src/lib/engine/rng.ts; engine/types.ts re-exports it, no second declaration. int(rng,min,max) includes both bounds, next() is in [0,1)."
  - "U2 (wave 2): Kit 3 removed $lib. Import via package.json imports `#lib/...` WITH explicit extension (`#lib/engine/types.ts`, `#lib/ui/Button.svelte`). storage.ts contract: read(key): string|null, write(key, value: string), remove(key) — raw strings, session.ts handles corrupt JSON. Per-game Config/State/Action are placeholders for U5 to replace. getDemo() returns null until U12. schema_migrations table is created by U3 db.ts migrate(), not 0001_content.sql. playerRange throws until U6."
  - "U3 closed the .e2e/<PORT>.db harness gap: e2e/healthz.test.ts proves the server used it."
  - "U3 (wave 3): node:sqlite, no new dep. DATABASE_PATH default rues-arcade.db, migrations dir `migrations` relative to cwd → server runs from package root and the U8 tarball must ship migrations/. Kit 3 CSRF: browser DELETE without content-type on plain http → 403; U11 editor sends DELETE with content-type application/json; U8 must check origin/PROTOCOL_HEADER for the deployed server. ServerInit comes from @sveltejs/kit/hooks."
  - "U4 (wave 3): Button plays press itself (game screens must not); HoldToView plays reveal on hold start, demo mode shows content with [Demo] tag and tap = release; countUp owns element text (`<span use:countUp={n}></span>`, de-DE). motion.ts also exports rise, pulse, reducedMotion(), ease. app.css helpers: .shell (single alignment rule, 16px/32px gutters, max 1216px), .stack .row .cols .split .label .muted .data .panel .reveal .reveal-word .rise — pages use these. Mute persistence needs U6 storage.ts. GameTile needs U6 playerRange."
  - "U5 (wave 3): engines are pure reducers; off-phase actions return the same state object. Imposter phases handover|view|crew|unmask, actions handover seen reveal unmask nextRound skip. Wavelength phases prep|reveal|guess|result|gameOver, actions show redraw guess dial(0–180) lockIn next again; exports scoreFor, targetBands, psychic(state), winners(state), team/round constants. U12 demo runner builds players as { id: name, name } (Wavelength demo config.teams uses names as ids)."
  - "U8 (wave 4): vite.config.ts test.include now has scripts/**/*.test.ts. Tarball keeps package-lock.json and migrations/. playwright sends x-forwarded-proto and sets PROTOCOL_HEADER=x-forwarded-proto; DB path is absolute. Deployed server MUST set PROTOCOL_HEADER (or ORIGIN) behind the proxy, else Kit CSRF returns 403 on form posts/DELETEs; the Homelab deploy change has to set it."
  - "U7 (wave 4): import.mjs imports src/lib/server/db.ts directly (Node type stripping) and resolves migrations/ relative to the script. Open point for Verify: package.json engines says >=22.5 but type stripping is default only from 22.18/23.6 → bump engines or compile. tsconfig does not include scripts/, so svelte-check skips scripts/*.test.ts. Dry run on archive dev.db: imposter_pairs 35, wavelength_spectra 40; rerun adds 0."
  - "U6 (wave 4) deviation from design.md: the lobby creates the session (GET /api/content/<type>, def.init with random uint32 seed, saveSession, goto play route); spielen/+page.server.ts only 404s unknown slugs, the play route only resumes. Lobby shows player pick only when roster > max. Spiel beenden confirms via Modal (Beenden/Weiterspielen). Home has sr-only h1 Rue's Arcade, visible title Was spielen wir heute?"
  - "U6 contracts: lobby renders <entry.Setup players={chosen} onstart={start} />, onstart(config) does init+save+goto, Setup renders its own start Button. Play route renders <Stage key={def.phase(state)}><entry.Screen state dispatch /></Stage> (Screen remounts per phase; dispatch = reduce + saveSession; state is $state.raw). Start screen links <base>/demo?from=<base>, <base>/erklaerung, <base>/inhalte; play header Demo uses ?from=<base>/spielen; Spieler accepts ?from=. roster.players is $state.raw [{id,name}], read after onMount. Keys arcade:roster, arcade:session:<slug> = {v,state}. e2e/helpers: seedRoster(page,names) ids p1..pN, seedContent(request,type,rows), shot(page,info,slug) waits for animations, asserts no h-scroll, writes test-results/shots/<project>-<slug>.png."
learnings:
  - "Explore: offered 'new repo, same remote' with fresh history → can't PR unrelated histories; user then chose a separate new repo. Check the git mechanics of a repo-replacement option before offering it."
  - "User asked for an array of visual options to pick from instead of choosing between three described directions → show visual directions as a design canvas gallery, not as text options."
  - "Look A (Arcade Boss Rush, Duolingo/Kahoot-grounded) read as 'zu kindlich und zu grell' to Rue → for Rue's game UIs, start from grown-up references (console/chess-club) and keep candy-saturated colours off large areas."
  - "A1 (muted) read as 'zu matt' — Rue's target saturation sits between A and A1: colours that pop without stabbing; when tuning palette for Rue, show several palettes on a fixed design rather than one."
  - "U1: SvelteKit 3 / Vite 8 / TS 6 / vitest 5 broke the repo-setup.md SvelteKit recipe (svelte.config.js rejected, tsconfig must extend $app/tsconfig) → update the recipe; check the installed Kit major before scaffolding."
  - "U1: vitest picks up e2e/*.test.ts by default → the recipe should set test.include to src/**/*.test.ts."
  - "U2: stub .svelte components with `void prop` trip state_referenced_locally under --fail-on-warnings → leave destructured props unused in stubs."
  - "U3: `npm run proof | tail` hid a non-zero exit and a red commit landed → builders run proof to a log and check $?, never through a pipe without pipefail."
  - "U4: a leftover preview server held the unit port during proof:full → wait for the port to be free before proof:full."
  - "U5: contract tests written after reducers existed went green first run → order engine tasks so contract tests precede the reducer, or accept them as regression tests."
  - "U8: Write to an existing file failed until it was Read, so the first proof:full ran against the old config → builders Read before overwriting and re-check the file before a proof run that depends on it."
  - "U7: a Bash call bundling a python heredoc edit with proof hung silently, neither ran → keep edits and proof runs in separate calls."
  - "U6: screenshots taken during .rise entry animations came out blank → shot() waits for finite animations; e2e screenshot helpers should do this by default."
  - "U6: grid column without minmax(0,1fr) widened the phone page to 462px via input intrinsic width → use minmax(0,1fr) for form columns."
  - "U10: builder ran proof:full once on the finished state and split it into per-task commits afterwards; intermediate commits weren't proven → builder brief should insist on proof before each task commit, not after the unit"
  - "Gate 2 taste (U10 Wavelength): gold dial needle, teal bands at 100/62/34%, fewest valid teams by default with tap-to-move chips + Mischen, start reads \"Los geht's\"; reveal HoldToView has no action (engine has no 'seen'). Shots: test-results/shots/{phone,desktop}-*wavelength*.png"
  - "U11: phone and desktop Playwright projects share one e2e DB and run in parallel, so identical fixture content collides as duplicates → split content-writing tests across games per project (or per-project data)"
  - "U11: iframe box measured 799.99 during the .rise animation → e2e geometry checks wait for animations / compare rounded values"
  - "Gate 2 (U11): Esc closes the Erklärung viewer only while focus is outside the sandboxed iframe; after a tap into the slides only the close button works (documented in static/explain/README.md). Fix would need a postMessage contract. Extras: 2 non-spec e2e tests, 'Demo starten' on the empty state, failed import lines echo their text."
  - "U9: ScreenProps names the prop `state`, which collides with the $state rune (svelte-check store_rune_conflict) → destructure as `let { state: game, dispatch } = $props()`; contract props shouldn't be named after runes"
  - "U9: 9.2's scenarios were already satisfied by U6's play route, so they were never red for the right reason → planner shouldn't give a later unit scenarios an earlier unit already delivers"
  - "Wave 5 merge: units green alone, red together: Playwright filter({ hasText }) is a case-insensitive substring match, so a seed in another unit's test (\"zu Mittag?\") matched \"Tag\" in the shared e2e DB → row locators match exact text (has: getByText(x, { exact: true }))"
  - "Gate 2 taste (U9 Imposter): no dedicated mock in design/; built from Card tone=imposter, HoldToView, gold .reveal for unmask, player-order sidebar on desktop; copy \"Los geht's\" and \"<Name> ist bereit\"; skip asks to confirm (archive behaviour, extra e2e). Shots: test-results/shots/{phone,desktop}-imposter-*.png"
  - "U13: desktop-width check averaged over 80px bands falsely failed a lobby with short headings → measure how far painted content reaches across the column instead of average coverage"
  - "U13: Playwright clears test-results/ each run, so builder screenshots vanish on the next e2e run → Gate 2 shots must be produced and committed by the verifier (shots/), not taken from builder worktrees"
  - "Gate 2 (U13): manual checks = look on screenshots (24 screens × phone/desktop, {phone,desktop}-look-<screen>.png; Inhalte shots show leftover e2e entries) and sound on a real phone (press/reveal/correct/wrong/win distinct, mute persists, no sound before first tap). Component fix: Erklärung empty state lost max-width:560px to use desktop width. Desktop-width check is coarse (≥75% reach), alignment stays Rue's call."
  - "U12: demo state handed to setDemo via $derived went stale after the demo page unmounted (next page's buttons stayed disabled) → module-slot getters read raw $state and are nulled in onDestroy"
  - "U12: 'empty database' scenario solved with a dedicated node build on PORT=0 with its own .e2e db → reusable pattern for e2e scenarios needing isolated data"
  - "Verify r1: package.json engines >=22.5 but scripts/import.mjs needs default Node type stripping (22.18+/23.6+); CI pins 22 so it passed → engines range must match the oldest Node a script actually runs on"
  - "Gate correction (2026-10-05, Rue): Esc in the Erklärung iframe → narrow the spec: Esc closes while focus is in the app, the close button always works (no postMessage contract)"
  - "Verify r1: reviewer found 3 weak Scenario tests (mocked server load, reset request log, hand-picked contrast pairs) that builders and verifier passed → builder brief should say: WHEN clauses about data state need real data state (dedicated server), not mocked responses"
  - "Fixer r1: backup cp via a wrong $OLDPWD left a stray file outside the repo (/home/Rue/Repos/scratch-demo.svelte); its rm was blocked → back up into the scratchpad or use git stash/git show, never relative-to-$OLDPWD paths"
  - "Gate 2 (fixer r1): new token --imposter-text #ed6c78 (base --imposter #eb616d unchanged) on Wavelength short-team count and Imposter current-player dot; shots look-lobby-wavelength-short, look-imposter-handover. engines now >=22.18 (Homelab nodejs_version must match). Contrast + fresh-DB scenarios moved unit→e2e."
