triage: "feature — new repo, data model, deploy pipeline, new features, redesign; appetite ~3 sessions (foundation + Imposter + Wavelength)"
base: main
gate0: 2026-10-05
gate1: 2026-10-05
notes:
  - "Repo was created fresh with git init; main has no commit yet (unborn). Planner: settle how main gets its root commit before Build/Ship (new GitHub repo Rue-Asha/Rues-Arcade is created only at Ship, with consent)."
  - "User wants a pause at every checkpoint so they can /clear."
  - "U1 (wave 1): Kit 3 has no svelte.config.js; Kit config lives in vite.config.ts. Rng interface is exported from src/lib/engine/rng.ts; engine/types.ts re-exports it, no second declaration. int(rng,min,max) includes both bounds, next() is in [0,1)."
  - "U2 (wave 2): Kit 3 removed $lib. Import via package.json imports `#lib/...` WITH explicit extension (`#lib/engine/types.ts`, `#lib/ui/Button.svelte`). storage.ts contract: read(key): string|null, write(key, value: string), remove(key) — raw strings, session.ts handles corrupt JSON. Per-game Config/State/Action are placeholders for U5 to replace. getDemo() returns null until U12. schema_migrations table is created by U3 db.ts migrate(), not 0001_content.sql. playerRange throws until U6."
  - "U3 closed the .e2e/<PORT>.db harness gap: e2e/healthz.test.ts proves the server used it."
  - "U3 (wave 3): node:sqlite, no new dep. DATABASE_PATH default rues-arcade.db, migrations dir `migrations` relative to cwd → server runs from package root and the U8 tarball must ship migrations/. Kit 3 CSRF: browser DELETE without content-type on plain http → 403; U11 editor sends DELETE with content-type application/json; U8 must check origin/PROTOCOL_HEADER for the deployed server. ServerInit comes from @sveltejs/kit/hooks."
  - "U4 (wave 3): Button plays press itself (game screens must not); HoldToView plays reveal on hold start, demo mode shows content with [Demo] tag and tap = release; countUp owns element text (`<span use:countUp={n}></span>`, de-DE). motion.ts also exports rise, pulse, reducedMotion(), ease. app.css helpers: .shell (single alignment rule, 16px/32px gutters, max 1216px), .stack .row .cols .split .label .muted .data .panel .reveal .reveal-word .rise — pages use these. Mute persistence needs U6 storage.ts. GameTile needs U6 playerRange."
  - "U5 (wave 3): engines are pure reducers; off-phase actions return the same state object. Imposter phases handover|view|crew|unmask, actions handover seen reveal unmask nextRound skip. Wavelength phases prep|reveal|guess|result|gameOver, actions show redraw guess dial(0–180) lockIn next again; exports scoreFor, targetBands, psychic(state), winners(state), team/round constants. U12 demo runner builds players as { id: name, name } (Wavelength demo config.teams uses names as ids)."
learnings:
  - "Explore: offered 'new repo, same remote' with fresh history → can't PR unrelated histories; user then chose a separate new repo. Check the git mechanics of a repo-replacement option before offering it."
  - "User asked for an array of visual options to pick from instead of choosing between three described directions → show visual directions as a design canvas gallery, not as text options."
  - "Look A (Arcade Boss Rush, Duolingo/Kahoot-grounded) read as 'zu kindlich und zu grell' to Rue → for Rue's game UIs, start from grown-up references (console/chess-club) and keep candy-saturated colours off large areas."
  - "A1 (muted) read as 'zu matt' — Rue's target saturation sits between A and A1: colours that pop without stabbing; when tuning palette for Rue, show several palettes on a fixed design rather than one."
  - "U1: SvelteKit 3 / Vite 8 / TS 6 / vitest 5 broke the repo-setup.md SvelteKit recipe (svelte.config.js rejected, tsconfig must extend $app/tsconfig) → update the recipe; check the installed Kit major before scaffolding."
  - "U1: vitest picks up e2e/*.test.ts by default → the recipe should set test.include to src/**/*.test.ts."
  - "U2: stub .svelte components with `void prop` trip state_referenced_locally under --fail-on-warnings → leave destructured props unused in stubs."
  - "U3: `npm run proof | tail` hid a non-zero exit and a red commit landed → builders run proof to a log and check $?, never through a pipe without pipefail."
  - "U4: a leftover preview server held the unit port during proof:full → wait for the port to be free before proof:full."
  - "U5: contract tests written after reducers existed went green first run → order engine tasks so contract tests precede the reducer, or accept them as regression tests."
