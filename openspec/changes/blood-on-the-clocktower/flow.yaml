track: feature
triage: 'feature (set) — new game Blood on the Clocktower (Trouble Brewing): own theme, count-first lobby + explanation deck, storyteller grimoire, guided nights, public days with voting clock, end detection
  + reveal. Appetite: one change, multi-session, ~10-12 units in 4-5 waves, deck last.'
base: main
gate0: 2026-10-14
gate1: 2026-10-14
gate0_r2: 2026-10-15  # Gate 2 revisions round 2 (S50–S66) scope approved
gate1_r2: 2026-10-15  # round 2 plan U17–U22 approved incl. additions 1–5 and both legibility exceptions
learnings:
- 'U21 friction (2026-10-15): the 15-seat phone grimoire with a block card puts the primary action at 872px of 844 even after compacting the card; the planner''s fit estimate covered the circle but not circle + head + card → fit estimates sum every block on the screen, not the circle alone'
- 'U21 friction (2026-10-15): a Playwright run in a unit worktree without PORT hung until backgrounded (default port taken) → unit briefs say every playwright command carries the unit''s PORT, also scoped runs'
- 'wave 3 (2026-10-15): the orchestrator committed flow.yaml with an unquoted '': '' in a learning, flow-status crashed → orchestrator writes learning candidates as single-quoted YAML strings and runs flow-status after committing (strengthens the ''Editing flow.yaml'' learning)'
- 'Playwright click() treats aria-disabled="true" as not actionable → tests that tap a deliberately unavailable seat (out of sector, dead) need click({ force: true }) (U18, U19 friction, 2026-10-15)'
- 'a CSS transition from a state change can start from the old value (hand glided from the nominee''s centre) → commit the start value with a forced layout before the first step; look walks with long seat times must finish() running transitions before settled() (U19 friction, 2026-10-15)'
- 'builders edited one line each in files of a later unit (U19: day-layout hint string, day walk; U20: tokens.test.ts selector) to keep tests green → planner lists the e2e/walk files a behaviour change reaches, not only the ones it owns (wave 2, 2026-10-15)'
- e2e files of one change can't run in parallel with the look baseline on the same port → a builder measuring look-walk time runs it in its own run before and after (U17 friction, 2026-10-15)
- Rue at Gate 2 round 2 (2026-10-15): 17 more revisions after S39–S49, mostly the seat node (name vs number, icons, status badges, nomination rings), the vote sweep rule and show texts in the circle centre → explore for a circle/board game walks each screen's node content and status markers with the user before planning
- identification step before scoping Gate 2 feedback (Explore agent on code + verifier shots) resolved "Uhr" and "Bluffs unten" in one question round; Mobbin has no circular/seat-layout references, so radial patterns are component-level only (2026-10-15)
- builders wait on proof:full: background output file stays empty until exit and a tail/wait loop gets auto-backgrounded at 120s → read the redirected log only after the completion notice (U14 friction; strengthens the polling learning, 2026-10-15)
- parallel wave builders each run proof:full at the same time → timing flakes (most-likely frame, frame.test 220.7>220, session.test 5s, day Timer) cost U12 two extra full runs and U13 one → stagger or serialise proof:full across a wave's worktrees (strengthens the existing 'never two in parallel' learning, wave 5, 2026-10-14)
- U13 and U16 committed per task after `proof` + scoped e2e and ran proof:full once at the end; U12/U16 wrote some tests without watching them fail → the per-task fail-first/proof rule keeps slipping under time pressure; brief should name the per-task proof (proof + scoped e2e) and keep proof:full once per unit explicit (strengthens builder learning, 2026-10-14)
- planner on Gate 2 revisions: the user's "rechtsbündig" matched no box (panels were left-aligned) and "Uhr" had two candidates → gate feedback naming UI elements gets a screenshot-backed identification step before planning, and the open readings go back to the user (2026-10-14)
- Rue at Gate 2 (2026-10-14): 11 visual revisions (night/day atmosphere with stars, moon, sun; decorated connected circle and ghost token; roles at a glance in setup; non-sticky Weiter when scrolling; compact show-bar; emphasised day clock; end screen grouped by team) after the build looked flat → explore asks for the decoration/atmosphere level and the storyteller's at-a-glance info per screen, and the design brief states them before planning
- Rue chose in Verify r1 (2026-10-14): desktop sheet slide keeps ≥12px as an exception to the deck's 16px rule (one-screen overview); ghost vote stays symbol-only (✕ ●/✕ ○) with the words in the accessible label → spec wording "shape and label" and "every slide ≥16px" were ambiguous or infeasible for dense reference screens; planner states legibility exceptions explicitly
- review r1 found 3 reproduced reducer bugs (duplicate history key on end reveal, Zurück onto an answered dusk question traps the guide, starpass leaves the new Imp's old Minion step) that unit tests per action missed → planner adds cross-action sequence scenarios (SW takeover + starpass same night, back across answered questions) for state machines (2026-10-14)
- Rue chose (2026-10-14, after U11): phone character sheet scrolls at ≥14px text instead of fitting one screen at 9.5px; fullscreen explanation deck (covers header and mute) accepted → the planner specced "sheet fits one phone screen" without measuring whether 22 entries fit at a legible size; dense reference screens get a fit estimate at planning time
- the look walk grows with every unit (deck alone added ~34 screens per project; 2.0m of a 300s budget) → planner budgets look-walk time per unit (U11 friction, 2026-10-14)
- a fixer committed on a red proof:full after the one failing test (feud-history tiebreak, shared DB) passed alone → fixer briefs say: a red full run means rerun the whole proof:full once before committing, never a scoped rerun (2026-10-14)
- a fixer replaced a placeholder-only assertion with an unnamed `getByRole('heading')`, which broke under strict mode once the real screen had several headings → fixers assert one named, specced element, never a bare role (wave-2 fix, red again after wave 3, 2026-10-14)
- placeholders from earlier units satisfied later scenarios (U7 drag/5-seat, U8 Wecke heading, U9 header status), so tests passed before the code → planner keeps placeholders minimal (no headings or behaviour a later scenario asserts) and the brief says a test green on the placeholder must be tightened until it fails (U7, U8, U9, 2026-10-14)
- parallel units fixed shared components outside their files (U7 Circle tap + engine `back`, U9 Circle hand CSS); merged cleanly, but the planner should assign shared-component fixes forced by a scenario to one unit (strengthens the existing planning learning, 2026-10-14)
- builder tests written after the code recurred: U4 4.4 e2e art test, U6 6.3 RoleCard test, U5 reload test passed against a looser placeholder → brief names the fail-first check per task (strengthens the existing builder learning, 2026-10-14)
- builders polling background runs with until-loops grepping for an exit marker never matched (the marker goes to task output, not the log) → wait for the completion notice; grep the log for "passed|failed" if needed (U4, U6 friction, 2026-10-14)
- design.md contract left `seatPositions`/`seatSize`' second arg ambiguous (box px vs 'setup'|'play') → planner gives units of every numeric contract arg (U6, 2026-10-14)
- waiting for proof:full with a foreground until-loop hit the 600s Bash cap twice → builders rely on the run_in_background completion notice (U1 friction, 2026-10-14)
- e2e files edited while proof:full runs break it (Playwright workers import test files lazily) → builders write only src files during a run (U1 friction, 2026-10-14)
- spec scenarios with exact team counts after a random fill are seed-dependent once a setup-modifying character (Baron) can be drawn → planner states the seed or the required(n, …) form in the scenario (U2 friction, 2026-10-14)
- explore extracted the deck's fonts/icons only into the session scratchpad → U2/U4 must re-extract; when explore extracts assets builders need, store them (or the extraction recipe) in the change dir
